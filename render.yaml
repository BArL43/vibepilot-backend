services:
  - type: web
    name: vibepilot-api
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: VIBE_API_BASE
        value: https://lk.vibemarketolog.ru/api/agent
      - key: VIBE_API_TOKEN
        sync: false
